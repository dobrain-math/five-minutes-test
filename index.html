<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>두뇌로수학 테스트</title>
		<!-- 카톡·문자에 링크를 붙였을 때 뜨는 미리보기 카드의 «기본값».
		     공유 링크(/s/코드)는 middleware.ts 가 제목·설명·주소를 학생·날짜에 맞게 바꿔 끼운다 -->
		<!-- og:image 는 카톡이 절대 주소만 읽는다. 그림 원본은 public/og-v2.png(1200×630). 그림을 바꾸면 파일 이름도 바꾼다 — 카톡이 같은 주소의 옛 그림을 캐시해 둔다 -->
		<meta name="description" content="클릭해 자세한 리포트를 확인해 보세요." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="두뇌로수학" />
		<meta property="og:url" content="https://five-minutes-test.vercel.app/" />
		<meta property="og:title" content="⭐두뇌로수학 연산 테스트 리포트" />
		<meta
			property="og:description"
			content="클릭해 자세한 리포트를 확인해 보세요."
		/>
		<meta
			property="og:image"
			content="https://five-minutes-test.vercel.app/og-v2.png"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="두뇌로수학 연산 테스트"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<!-- 직접 고른 테마를 첫 화면 그리기 전에 적용해 깜빡임을 막는다 (키: src/utils/theme.ts THEME_KEY) -->
		<script>
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark')
					document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
